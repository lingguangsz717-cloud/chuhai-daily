<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>贪吃蛇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: #0a0a0a;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  touch-action: none;
}
.game-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 16px;
  max-width: 100vw;
}
.top-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
.score-box {
  color: #666;
  font-size: 13px;
  letter-spacing: 1px;
}
.score-box span { color: #00ff88; font-size: 24px; font-weight: bold; }
.diff-group {
  display: flex; gap: 0; border: 1px solid #333; border-radius: 4px; overflow: hidden;
}
.diff-btn {
  background: transparent; border: none; color: #555; padding: 6px 12px;
  cursor: pointer; font-size: 12px; letter-spacing: 1px; transition: all .15s;
  border-right: 1px solid #333;
}
.diff-btn:last-child { border-right: none; }
.diff-btn:hover { color: #aaa; }
.diff-btn.active { background: #00ff88; color: #0a0a0a; font-weight: bold; }
canvas {
  border: 2px solid #1a1a2e; border-radius: 4px; background: #0f0f1a;
  max-width: 100vw; max-height: 60vh;
}
.hint { color: #444; font-size: 11px; letter-spacing: 1px; text-align: center; }
.restart {
  background: transparent; border: 1px solid #333; color: #888;
  padding: 6px 16px; border-radius: 4px; cursor: pointer;
  font-size: 12px; letter-spacing: 2px; transition: all .2s;
}
.restart:hover { border-color: #00ff88; color: #00ff88; }

/* dpad for mobile */
.dpad {
  display: grid;
  grid-template-columns: 60px 60px 60px;
  grid-template-rows: 60px 60px 60px;
  gap: 4px;
  margin-top: 4px;
}
.dpad-btn {
  background: #111;
  border: 1px solid #222;
  border-radius: 8px;
  color: #555;
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  transition: all .1s;
}
.dpad-btn:active { background: #1a1a2e; color: #00ff88; border-color: #00ff88; }
.dpad-center { background: transparent; border: none; color: #333; font-size: 10px; }

/* leaderboard */
.lb-section {
  border: 1px solid #1a1a2e; border-radius: 6px; background: #0c0c16;
  padding: 14px; width: 100%; max-width: 320px;
}
.lb-title {
  color: #666; font-size: 12px; letter-spacing: 2px; text-align: center;
  margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #1a1a2e;
}
.lb-row {
  display: flex; align-items: center; padding: 5px 4px; border-radius: 3px;
}
.lb-rank { width: 22px; color: #555; font-size: 11px; text-align: center; }
.lb-rank.top { color: #ffd700; font-weight: bold; }
.lb-name { flex: 1; color: #aaa; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-score { color: #00ff88; font-size: 12px; font-weight: bold; text-align: right; min-width: 40px; }
.lb-diff { font-size: 10px; color: #444; margin-left: 4px; }
.lb-empty { color: #333; font-size: 12px; text-align: center; padding: 16px 0; }
.lb-clear { background: transparent; border: none; color: #333; font-size: 10px; cursor: pointer; display: block; margin: 10px auto 0; letter-spacing: 1px; }
.lb-clear:hover { color: #ff4444; }

/* modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: flex; justify-content: center; align-items: center; z-index: 10;
}
.modal {
  background: #111; border: 1px solid #333; border-radius: 10px;
  padding: 28px 32px; text-align: center; min-width: 260px;
}
.modal h3 { color: #ff4444; margin-bottom: 6px; font-size: 16px; }
.modal .final { color: #00ff88; font-size: 32px; font-weight: bold; }
.modal .sub { color: #666; font-size: 11px; margin: 6px 0 14px; }
.modal input {
  background: #1a1a2e; border: 1px solid #333; color: #fff;
  padding: 8px 14px; border-radius: 4px; width: 100%;
  text-align: center; font-size: 14px; outline: none; letter-spacing: 1px;
}
.modal input:focus { border-color: #00ff88; }
.modal input::placeholder { color: #444; }
.modal .btn-row { display: flex; gap: 10px; margin-top: 12px; justify-content: center; }
.modal .btn { padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; letter-spacing: 1px; }
.btn-submit { background: #00ff88; color: #0a0a0a; border: none; font-weight: bold; }
.btn-submit:hover { background: #00cc6a; }
.btn-skip { background: transparent; color: #555; border: 1px solid #333; }
.btn-skip:hover { color: #888; }

@media (min-width: 600px) {
  .dpad { display: none; }
  .game-wrap { gap: 16px; }
}
@media (max-width: 599px) {
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="game-wrap">
  <div class="top-bar">
    <div class="score-box">分数 <span id="score">0</span></div>
    <div class="diff-group" id="diffGroup">
      <button class="diff-btn" data-diff="easy">简单</button>
      <button class="diff-btn active" data-diff="normal">普通</button>
      <button class="diff-btn" data-diff="hard">困难</button>
    </div>
    <button class="restart" onclick="restart()">重新开始</button>
  </div>
  <canvas id="canvas"></canvas>
  <div class="hint">键盘 ↑↓←→ WASD / 手机触屏滑动 · 空格暂停</div>
  <div class="dpad" id="dpad">
    <div></div>
    <button class="dpad-btn" data-dir="up">▲</button>
    <div></div>
    <button class="dpad-btn" data-dir="left">◀</button>
    <div class="dpad-center">方向</div>
    <button class="dpad-btn" data-dir="right">▶</button>
    <div></div>
    <button class="dpad-btn" data-dir="down">▼</button>
    <div></div>
  </div>
  <div class="lb-section">
    <div class="lb-title">🏆 排行榜</div>
    <div id="leaderboard"></div>
    <button class="lb-clear" onclick="clearLB()">清空排行</button>
  </div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const GRID = 20;
let COLS = 30, ROWS = 20;
let snake, food, dir, nextDir, score, running, speed, timer, difficulty = 'normal';
const DIFF_SPEED = { easy: 140, normal: 90, hard: 50 };
let touchStart = null;

function resizeCanvas() {
  const isMobile = window.innerWidth < 600;
  if (isMobile) {
    const maxW = Math.min(window.innerWidth - 32, 400);
    const maxH = window.innerHeight * 0.45;
    const size = Math.min(maxW, maxH);
    COLS = Math.floor(size / GRID);
    ROWS = Math.floor(size / GRID);
  } else {
    COLS = 30; ROWS = 20;
  }
  canvas.width = COLS * GRID;
  canvas.height = ROWS * GRID;
}

function init() {
  resizeCanvas();
  snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}, {x: Math.floor(COLS/2)-1, y: Math.floor(ROWS/2)}, {x: Math.floor(COLS/2)-2, y: Math.floor(ROWS/2)}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = DIFF_SPEED[difficulty];
  running = true;
  document.getElementById('score').textContent = '0';
  spawnFood();
}

function spawnFood() {
  const all = [];
  for (let x = 0; x < COLS; x++)
    for (let y = 0; y < ROWS; y++)
      if (!snake.some(s => s.x === x && s.y === y))
        all.push({x, y});
  food = all[Math.floor(Math.random() * all.length)];
}

function update() {
  if (!running) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver(); return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    spawnFood();
    if (speed > 35) {
      clearInterval(timer);
      speed = Math.max(35, speed - 2);
      timer = setInterval(update, speed);
    }
  } else { snake.pop(); }
}

function gameOver() {
  running = false;
  clearInterval(timer);
  const lb = getLB();
  const min = lb.length < 10 ? 0 : lb[lb.length-1].score;
  if (score > min || lb.length < 10) {
    showNameModal();
  } else {
    drawGameOver();
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ff4444';
  const fs = canvas.width < 400 ? 22 : 28;
  ctx.font = `bold ${fs}px "Microsoft YaHei","PingFang SC",sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('游戏结束', canvas.width/2, canvas.height/2 - 8);
  ctx.fillStyle = '#888';
  ctx.font = `${fs-14}px "Microsoft YaHei","PingFang SC",sans-serif`;
  ctx.fillText('点击「重新开始」再来一局', canvas.width/2, canvas.height/2 + 26);
}

function showNameModal() {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'modal';
  ov.innerHTML = `
    <div class="modal">
      <h3>游戏结束</h3>
      <div class="final">${score}</div>
      <div class="sub">难度: ${difficulty==='easy'?'简单':difficulty==='normal'?'普通':'困难'}</div>
      <input id="nickname" placeholder="输入你的昵称" maxlength="10" autofocus>
      <div class="btn-row">
        <button class="btn btn-submit" onclick="submitScore()">上榜</button>
        <button class="btn btn-skip" onclick="skipScore()">跳过</button>
      </div>
    </div>
  `;
  document.body.appendChild(ov);
  setTimeout(() => document.getElementById('nickname').focus(), 100);
  document.getElementById('nickname').addEventListener('keydown', e => { if (e.key === 'Enter') submitScore(); });
}

function submitScore() {
  const name = document.getElementById('nickname').value.trim() || '匿名';
  const lb = getLB();
  lb.push({ name, score, difficulty, time: Date.now() });
  lb.sort((a, b) => b.score - a.score);
  if (lb.length > 50) lb.length = 50;
  localStorage.setItem('snakeLB', JSON.stringify(lb));
  document.getElementById('modal').remove();
  drawGameOver();
  renderLB();
}

function skipScore() { document.getElementById('modal').remove(); drawGameOver(); }

function getLB() { try { return JSON.parse(localStorage.getItem('snakeLB') || '[]'); } catch { return []; } }
function clearLB() { if (confirm('确定清空排行榜？')) { localStorage.removeItem('snakeLB'); renderLB(); } }

function renderLB() {
  const lb = getLB();
  const el = document.getElementById('leaderboard');
  if (!lb.length) { el.innerHTML = '<div class="lb-empty">暂无记录</div>'; return; }
  const top10 = lb.slice(0, 10);
  const dl = { easy: '简', normal: '普', hard: '难' };
  el.innerHTML = top10.map((e, i) => `
    <div class="lb-row">
      <div class="lb-rank${i<3?' top':''}">${i+1}</div>
      <div class="lb-name">${e.name}</div>
      <div class="lb-score">${e.score}<span class="lb-diff">${dl[e.difficulty]||''}</span></div>
    </div>
  `).join('');
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x*GRID, 0); ctx.lineTo(x*GRID, canvas.height); ctx.stroke(); }
  for (let y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y*GRID); ctx.lineTo(canvas.width, y*GRID); ctx.stroke(); }
  ctx.fillStyle = '#ff3366';
  ctx.shadowColor = '#ff3366';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, 2*Math.PI);
  ctx.fill();
  ctx.shadowBlur = 0;
  snake.forEach((s, i) => {
    const t = i / Math.max(snake.length - 1, 1);
    const g = Math.floor(200 + t * 55);
    const b = Math.floor(100 + t * 155);
    ctx.fillStyle = `rgb(0,${g},${b})`;
    ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
  });
  requestAnimationFrame(draw);
}

function setDifficulty(d) {
  difficulty = d;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === d));
  restart();
}

function restart() {
  clearInterval(timer);
  init();
  timer = setInterval(update, speed);
}

// dpad buttons
document.getElementById('dpad').addEventListener('click', e => {
  const btn = e.target.closest('.dpad-btn');
  if (!btn) return;
  const d = btn.dataset.dir;
  const map = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
  const nd = map[d];
  if (dir.x === -nd.x && dir.y === -nd.y) return;
  nextDir = nd;
});

// swipe on canvas
canvas.addEventListener('touchstart', e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, {passive: false});
canvas.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 20) return;
  let nd;
  if (absDx > absDy) nd = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
  else nd = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
  if (dir.x === -nd.x && dir.y === -nd.y) return;
  nextDir = nd;
});

// keyboard
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') { if (dir.y === 0) nextDir = {x:0,y:-1}; }
  else if (k === 'arrowdown' || k === 's') { if (dir.y === 0) nextDir = {x:0,y:1}; }
  else if (k === 'arrowleft' || k === 'a') { if (dir.x === 0) nextDir = {x:-1,y:0}; }
  else if (k === 'arrowright' || k === 'd') { if (dir.x === 0) nextDir = {x:1,y:0}; }
  else if (k === ' ') { e.preventDefault(); if (running) { running = false; clearInterval(timer); } else { running = true; timer = setInterval(update, speed); } }
});

document.getElementById('diffGroup').addEventListener('click', e => {
  if (e.target.classList.contains('diff-btn')) setDifficulty(e.target.dataset.diff);
});

window.addEventListener('resize', () => { resizeCanvas(); });

init();
timer = setInterval(update, speed);
requestAnimationFrame(draw);
renderLB();
</script>
</body>
</html>
